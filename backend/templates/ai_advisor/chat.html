{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>AI Tax Assistant</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="{% static 'style.css' %}">
    <link rel="stylesheet" href="{% static 'chat.css' %}">
</head>

<body>

    <div class="app">

        <!-- SIDEBAR -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-top">
                <span class="logo"> AI Tax Assistant</span>
                <button class="icon-btn" id="toggleSidebar">☰</button>
            </div>

            <a class="btn-primary-newchat new-chat" id="newChatBtn">+ New Chat</a>

            <div class="chat-history" id="chatHistory"></div>
        </aside>

        <!-- CHAT AREA -->
        <main class="chat-area" id="chatArea">

            <!-- CHAT MESSAGES -->
            <div class="messages" id="messages"></div>

            <!-- CENTERED INPUT (initially) -->
            <div class="chat-input centered" id="chatInput">
                <input type="text" id="messageInput" placeholder="How can I help you today?" />
                <button class="btn-primary" id="sendBtn">Send</button>
            </div>

        </main>
    </div>

    <script src="{% static 'chat.js' %}"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</body>

</html>
