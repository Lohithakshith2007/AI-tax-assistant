<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container {
  display: grid;
  gap: 10px;
  padding: 10px;
  border: 2px dashed #444;

  /* CHOOSE ONE OF THE OPTIONS BELOW: */

  /* Option A: Fixed Widths (Rigid) */
  /* grid-template-columns: 200px 100px 300px; */

  /* Option B: Fractional Units (Flexible/Responsive) */
  /* grid-template-columns: 1fr 2fr 1fr; */

  /* Option C: The Repeat Shortcut (Cleanest) */
  grid-template-columns: repeat(3,1fr); 
}

.box {
  padding: 20px;
  color: white;
  text-align: center;
  font-family: sans-serif;
  border-radius: 8px;
}
.red { background: #ff5f5f; }
.blue { background: #5fafff; }
.green { background: #5fff8f; }
    </style>
</head>
<body>
    <div class="container">
  <div class="box red">1</div>
  <div class="box blue">2</div>
  <div class="box green">3</div>
</div>
</body>
</html>
